name: "SSH setup"
description: "Writes the deploy key and known_hosts, then validates the key parses."

# Shared by deploy.yml and ytdlp-update.yml. Both used to carry an identical
# copy of this block; keeping it in one place stops the two drifting apart.

inputs:
  ssh-key:
    description: "Private deploy key (secrets.DEPLOY_SSH_KEY)"
    required: true
  known-hosts:
    description: "Pinned host key line(s) (secrets.DEPLOY_KNOWN_HOSTS)"
    required: true

runs:
  using: composite
  steps:
    - name: Write key and known_hosts
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # `tr -d '\r'` is essential, not cosmetic.
        #
        # An HTML textarea normalizes newlines to CRLF when submitted, so a
        # private key pasted into the GitHub secrets UI usually arrives with
        # CRLF line endings. OpenSSH then refuses it with the singularly
        # unhelpful:
        #
        #     Load key "/home/runner/.ssh/deploy_key": error in libcrypto
        #
        # The same error appears if the key lacks a trailing newline, which
        # `printf '%s\n'` guarantees. Both were reproduced directly:
        # a CRLF key and a newline-less key each fail, and stripping CR fixes it.
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Validate the key before connecting
      shell: bash
      run: |
        set -uo pipefail
        # Deriving the public key from the private one proves it parses. Doing
        # this before ssh runs turns "error in libcrypto / Permission denied"
        # into an actionable message.
        if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
          # Classify the failure rather than reporting a generic "malformed".
          # Only structural facts are examined - no key material is printed.
          lines=$(wc -l < ~/.ssh/deploy_key)
          bytes=$(wc -c < ~/.ssh/deploy_key)
          first=$(head -1 ~/.ssh/deploy_key)
          last=$(grep -v '^[[:space:]]*$' ~/.ssh/deploy_key | tail -1)

          if [ "$bytes" -le 1 ]; then
            diagnosis="The secret is EMPTY or unset."
            remedy="Add DEPLOY_SSH_KEY under Settings -> Secrets and variables -> Actions."
          elif printf '%s' "$first" | grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-)'; then
            diagnosis="That is the PUBLIC key, not the private one."
            remedy="DEPLOY_SSH_KEY needs the file with NO .pub extension. The .pub half belongs on the VPS instead."
          elif ! printf '%s' "$first" | grep -q 'BEGIN.*PRIVATE KEY'; then
            diagnosis="The first line is not a PEM header, so the paste is truncated or shifted."
            remedy="The secret must start with the -----BEGIN OPENSSH PRIVATE KEY----- line."
          elif ! printf '%s' "$last" | grep -q 'END.*PRIVATE KEY'; then
            diagnosis="The -----END OPENSSH PRIVATE KEY----- line is missing, so the paste was cut short."
            remedy="Re-copy the whole file; the END line is required."
          elif [ "$lines" -le 2 ]; then
            diagnosis="The key is on a single line - the newlines were lost in the paste."
            remedy="It must stay multi-line. Copy with -Raw (see below) rather than retyping."
          else
            diagnosis="Header and footer look right, so the base64 body is corrupt or incomplete."
            remedy="Re-copy the file verbatim; do not edit, re-wrap, or retype any of it."
          fi

          echo "::error title=DEPLOY_SSH_KEY is malformed::${diagnosis}"
          echo ""
          echo "Diagnosis: ${diagnosis}"
          echo "Fix:       ${remedy}"
          echo ""
          echo "Structure seen (no key material shown):"
          echo "  bytes            : ${bytes}"
          echo "  lines            : ${lines}      (a valid ed25519 key is 7)"
          echo "  starts with BEGIN: $(printf '%s' "$first" | grep -q 'BEGIN.*PRIVATE KEY' && echo yes || echo NO)"
          echo "  ends with END    : $(printf '%s' "$last" | grep -q 'END.*PRIVATE KEY' && echo yes || echo NO)"
          echo ""
          echo "To re-copy on Windows (PowerShell) - -Raw preserves the line breaks:"
          echo "    Get-Content \$env:USERPROFILE\\.ssh\\nazarick_ci -Raw | Set-Clipboard"
          echo ""
          echo "Then verify locally BEFORE pasting, so you know the file itself is sound:"
          echo "    ssh-keygen -y -f \$env:USERPROFILE\\.ssh\\nazarick_ci"
          exit 1
        fi
        echo "Deploy key parsed successfully; fingerprint:"
        ssh-keygen -lf ~/.ssh/deploy_key

        # Count non-blank lines rather than testing with `-s`: an unset secret
        # still produces a one-byte file (just the newline that printf adds),
        # which `-s` would happily accept as non-empty.
        host_entries="$(grep -cv '^[[:space:]]*$' ~/.ssh/known_hosts || true)"
        if [ "${host_entries:-0}" -lt 1 ]; then
          echo "::error title=DEPLOY_KNOWN_HOSTS is empty::Set it to the output of 'ssh-keyscan <vps-ip>'."
          echo ""
          echo "Without it ssh cannot verify the VPS and will refuse to connect"
          echo "in BatchMode. Run this on your PC and paste the whole output:"
          echo "    ssh-keyscan <vps-ip>"
          echo "Or copy the ready-made line from section 6 of hosting/setup_cicd.sh."
          exit 1
        fi
        echo "known_hosts entries: ${host_entries}"
