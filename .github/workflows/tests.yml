name: tests

# Runs on every push to master and on every pull request.
#
# SECURITY: this workflow deliberately uses no secrets. `pull_request` from a
# fork runs with a read-only token and no access to repository secrets, so it
# is safe for a public repo. Deployment lives in a separate workflow that only
# triggers on push to master.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # README targets 3.11+; 3.12+ guards against upcoming breakage.
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            # No private_config.py is needed: tests/conftest.py injects a fake into
            # sys.modules before anything imports it. Nothing here contacts Discord.
            - name: Run tests with coverage
              run: python -m pytest -q

            - name: Upload coverage HTML
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-html-py${{ matrix.python-version }}
                  path: htmlcov/
                  retention-days: 14
                  if-no-files-found: ignore
